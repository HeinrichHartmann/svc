services:
  restic:
    image: restic-job:latest
    environment:
      - B2_ACCOUNT_ID
      - B2_ACCOUNT_KEY
      - RESTIC_PASSWORD
    volumes:
      - /share/hhartmann:/share:ro
      - /share/hhartmann/attic/.restic:/share/attic/.restic
      - /share/hhartmann/var/restic:/cache
    tmpfs:
      - /tmp
    restart: unless-stopped
