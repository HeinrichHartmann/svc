http:
  routers:
    traefik-dashboard:
      rule: "HostRegexp(`^traefik`)"
      service: api@internal
      entryPoints:
        - web
        - websecure
      tls: {}
  
tls:
  certificates:
    - certFile: "/var/letsencrypt/config/live/heinrichhartmann.net/fullchain.pem"
      keyFile: "/var/letsencrypt/config/live/heinrichhartmann.net/privkey.pem"