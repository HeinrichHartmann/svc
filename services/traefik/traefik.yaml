# traefik.yaml
log:
  level: DEBUG

api:
  dashboard: true
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
providers:
  docker: {}
  file:
    filename: /etc/traefik/dynamic.yaml
  
