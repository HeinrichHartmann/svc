# Local overrides for dovecot configuration

# Disable SSL and allow plaintext auth (internal network only)
ssl = no
auth_allow_cleartext = yes

# Maildir location
mail_driver = maildir
mail_path = /mail/%{user}

# Static password - use environment variable
passdb static {
  password = %{env:USER_PASSWORD}
}

# Static userdb - allow any user
userdb static {
  template = uid=vmail gid=vmail home=/mail/%{user}
}
