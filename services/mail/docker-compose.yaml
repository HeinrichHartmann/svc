services:
  mbsync:
    image: mbsync:latest
    container_name: mbsync
    restart: "no"
    user: "1000:100"

    volumes:
      # Maildir storage
      - /share/hhartmann/var/mbsync:/data

      # mbsync configuration
      - ./mbsyncrc:/config/.mbsyncrc:ro

      # Secrets (Gmail app passwords)
      - /home/hhartmann/box/secrets/gmail_hhartmann1729.key:/secrets/gmail_hhartmann.key:ro
      - /home/hhartmann/box/secrets/gmail_derhein.key:/secrets/gmail_derhein.key:ro

    # No networking needed for this sync-only container
    network_mode: "bridge"

  dovecot:
    image: dovecot/dovecot:latest
    container_name: dovecot
    restart: unless-stopped
    environment:
      - USER_PASSWORD=mailpass
      - DOVECOT_PROTOCOLS=imap
      - DOVECOT_AUTH_MECHANISMS=plain login
    volumes:
      - /share/hhartmann/var/mbsync/Maildir:/mail:ro
      - ./dovecot.conf:/etc/dovecot/conf.d/99-local.conf:ro
    networks:
      - mail

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: unless-stopped
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=dovecot
      - ROUNDCUBEMAIL_DEFAULT_PORT=31143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://smtp.gmail.com
      - ROUNDCUBEMAIL_SMTP_PORT=587
    volumes:
      - /share/hhartmann/var/roundcube:/var/roundcube/db
    networks:
      - mail
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.roundcube.rule=HostRegexp(`^mail\\.`)"
      - "traefik.http.routers.roundcube.entrypoints=websecure"
      - "traefik.http.routers.roundcube.tls.certresolver=default"
      - "traefik.http.services.roundcube.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

networks:
  mail:
    driver: bridge
  traefik:
    external: true
