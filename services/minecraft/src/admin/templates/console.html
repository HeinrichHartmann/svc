<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { color: #4CAF50; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .status.running { background: #4CAF50; color: white; }
        .status.stopped { background: #f44336; color: white; }
        .back-link {
            color: #2196F3;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .console-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        .console-output {
            flex: 1;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .log-line {
            margin: 2px 0;
            color: #aaa;
        }
        .command-line {
            color: #4CAF50;
            margin-top: 8px;
        }
        .command-output {
            color: #fff;
            margin-left: 20px;
        }
        .error-line {
            color: #f44336;
        }
        .console-input {
            display: flex;
            border-top: 2px solid #333;
            background: #1a1a1a;
            padding: 12px;
            align-items: center;
        }
        .console-input .prompt {
            color: #4CAF50;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-right: 10px;
        }
        .console-input input {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border-radius: 4px;
        }
        .console-input input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .console-input button {
            margin-left: 10px;
            padding: 8px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .console-input button:hover {
            background: #45a049;
        }
        .info-bar {
            background: #2a2a2a;
            padding: 8px 15px;
            font-size: 12px;
            color: #999;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Minecraft Console</h1>
            <p style="color: #999; font-size: 14px; margin-top: 5px;">
                Logged in as: <strong>{{ username }}</strong>
            </p>
        </div>
        <div style="text-align: right;">
            <span class="status {{ 'running' if status.running else 'stopped' }}">
                {{ status.status.upper() }}
            </span>
            <br>
            <a href="/" class="back-link">← Back to Admin</a>
        </div>
    </div>

    <div class="console-container">
        <div class="info-bar">
            <span>Server Console - Type commands below (e.g., "list", "say Hello", "gamemode survival Player")</span>
            <span id="timestamp"></span>
        </div>
        <div id="consoleOutput" class="console-output">
            <div class="log-line">Loading logs...</div>
        </div>
        <div class="console-input">
            <span class="prompt">&gt;</span>
            <input type="text" id="commandInput" placeholder="Enter command..." autofocus>
            <button onclick="sendCommand()">Send</button>
        </div>
    </div>

    <script>
        const consoleOutput = document.getElementById('consoleOutput');
        const commandInput = document.getElementById('commandInput');
        const timestampEl = document.getElementById('timestamp');

        // Auto-scroll to bottom
        function scrollToBottom() {
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            timestampEl.textContent = now.toLocaleTimeString();
        }
        setInterval(updateTimestamp, 1000);
        updateTimestamp();

        // Load initial logs
        async function loadLogs() {
            try {
                const response = await fetch('/api/logs?lines=50');
                const data = await response.json();

                consoleOutput.innerHTML = '';
                data.logs.forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'log-line';
                    div.textContent = line;
                    consoleOutput.appendChild(div);
                });
                scrollToBottom();
            } catch (error) {
                consoleOutput.innerHTML = '<div class="error-line">Error loading logs: ' + error.message + '</div>';
            }
        }

        // Send command
        async function sendCommand() {
            const command = commandInput.value.trim();
            if (!command) return;

            // Display command in console
            const cmdDiv = document.createElement('div');
            cmdDiv.className = 'command-line';
            cmdDiv.textContent = '> ' + command;
            consoleOutput.appendChild(cmdDiv);

            // Clear input
            commandInput.value = '';

            try {
                const response = await fetch('/api/console/command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command: command })
                });

                const data = await response.json();

                // Display output
                const outputDiv = document.createElement('div');
                if (response.ok) {
                    outputDiv.className = 'command-output';
                    outputDiv.textContent = data.output || '(no output)';
                } else {
                    outputDiv.className = 'error-line';
                    outputDiv.textContent = 'Error: ' + (data.detail || 'Command failed');
                }
                consoleOutput.appendChild(outputDiv);

                scrollToBottom();
            } catch (error) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-line';
                errorDiv.textContent = 'Error: ' + error.message;
                consoleOutput.appendChild(errorDiv);
                scrollToBottom();
            }
        }

        // Enter key to send
        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendCommand();
            }
        });

        // Auto-refresh logs every 5 seconds
        setInterval(async () => {
            try {
                const response = await fetch('/api/logs?lines=10');
                const data = await response.json();

                // Only append new lines (simple implementation)
                const lastLines = data.logs.slice(-5);
                lastLines.forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'log-line';
                    div.textContent = line;
                    consoleOutput.appendChild(div);
                });

                // Keep output from growing too large
                const children = consoleOutput.children;
                while (children.length > 500) {
                    consoleOutput.removeChild(children[0]);
                }

                scrollToBottom();
            } catch (error) {
                // Silently fail on auto-refresh
            }
        }, 5000);

        // Load initial logs on page load
        loadLogs();
    </script>
</body>
</html>
