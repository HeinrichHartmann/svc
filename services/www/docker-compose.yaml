networks:
  traefik:
    name: traefik
    external: true

services:
  www:
    image: nginx:latest
    networks:
      - traefik
    volumes:
      - /share/hhartmann/attic/www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "traefik.http.routers.www.rule=HostRegexp(`^www`)"
      - "traefik.http.routers.www.entrypoints=websecure"
      - "traefik.http.routers.www.tls=true"
      - "traefik.enable=true"
